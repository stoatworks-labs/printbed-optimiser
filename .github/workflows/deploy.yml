# Build the site and put it in front of visitors, on every push to main.
#
# The site is a static-assets-only Cloudflare Worker (wrangler.toml) serving dist/:
# the page, the pinned Muon3D slicer engine and its printer profiles. Cloudflare only
# hands out files; the slicing runs in the visitor's browser. Until this workflow
# existed the site was deployed by hand (first deploy 2026-11-07), and a push to main
# changed nothing at the edge.
#
# Deliberately the same shape as cosplay's and negative-space's deploy.yml, so the
# fleet reads alike and a fix to one is obvious in the others.

name: deploy

on:
  push:
    branches: [main]
    # Prose changes nothing a visitor of this site sees. paths-ignore only skips a
    # push when EVERY changed file matches, so the usual commit that touches both
    # source and a note in its docs still deploys.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/dependabot.yml"
  workflow_dispatch:

# Newest push wins. Cancelling an in-flight build is safe: wrangler uploads the
# assets first and activates the version as one step at the end, so a run killed
# part way through never becomes the live version. With cancel-in-progress false,
# two quick pushes could deploy in the wrong order and leave the older tree live.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # vitest 5 needs Node ^22.12 || ^24 || >=26, and vite 8 needs >=22.12.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Fail in a second rather than after a build. A deploy that cannot
      # authenticate is the whole point of this job failing to happen.
      - name: Check the Cloudflare token is present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set on this repository, so the"
            echo "::error::site cannot be deployed. Create a Cloudflare API token with"
            echo "::error::the 'Edit Cloudflare Workers' template scoped to this account,"
            echo "::error::then:"
            echo "::error::  gh secret set CLOUDFLARE_API_TOKEN --repo stoatworks-labs/printbed-optimiser"
            echo "::error::cf-run already uses such a token from the login keychain under"
            echo "::error::the service name 'stoatworks-cloudflare'; the same one works here."
            exit 1
          fi
          echo "token present - ok"

      - run: npm ci

      - run: npm test

      # prebuild runs scripts/fetch-engine.mjs, which downloads the pinned engine
      # release and profile set and checks their SHA-256 hashes before unpacking
      # them into public/slicer/. A changed or missing release fails the build here.
      - run: npm run build

      # Loads the built page in headless Chromium and fails on any runtime error or
      # an empty #root. The action serves dist/ without COOP/COEP, so the page is not
      # cross-origin isolated there. That is fine: the engine only starts once a
      # model is loaded, and the empty page renders without it.
      - name: Smoke-check the built site
        uses: stoatworks-labs/smoke-check@v1
        with:
          dir: dist

      # wrangler is not a dependency of this project; locally it comes from npx
      # through cf-run, which is why the version is pinned here rather than left to
      # resolve to latest. Dependabot's github-actions ecosystem only bumps `uses:`
      # refs, never a version inside a `run:`, so bump this deliberately and in step
      # with the rest of the fleet.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler's first-run metrics consent prompt would hang a non-interactive
          # run for ever. cf-run sets this locally for the same reason.
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.116.0 deploy

      # Prove it actually landed, against the domain a visitor uses.
      #
      # "It deployed" and "the page changed" are different claims, and the obvious
      # ways to check the second are both wrong here:
      #
      #   * The whole served body cannot be compared against dist/index.html.
      #     Cloudflare injects a bot-management script before </body> carrying a
      #     per-request nonce, so no two responses are byte-identical and the check
      #     would fail every time, on a healthy deploy.
      #   * The hashed asset filename alone is not enough either. It only moves when
      #     the JS or CSS moves, so a change to the <head> would sail through
      #     against a stale build.
      #
      # The <head> is untouched by the injection, and Vite writes the hashed JS and
      # CSS filenames into it alongside the meta tags. Hashing it therefore catches a
      # code change and a meta-only change alike, and is stable across requests.
      # When a push changes nothing the page serves, the old deploy hashes the same
      # and this passes either way; the Deploy step's "Current Version ID:" line is
      # what shows the upload happened.
      - name: Check the live site is serving this build
        run: |
          set -euo pipefail
          want=$(sed -n '1,/<\/head>/p' dist/index.html | shasum -a 256 | cut -d' ' -f1)
          echo "expecting the live <head> to hash to $want"
          for attempt in 1 2 3 4 5; do
            got=$(curl -sS --max-time 30 "https://printbed-optimiser.stoatworks-labs.com/" \
                  | sed -n '1,/<\/head>/p' | shasum -a 256 | cut -d' ' -f1 || true)
            if [ "$got" = "$want" ]; then
              echo "live site is serving this build (attempt $attempt)"
              exit 0
            fi
            echo "not there yet, got $got — retrying in 10s (attempt $attempt)"
            sleep 10
          done
          echo "::error::Deployed, but https://printbed-optimiser.stoatworks-labs.com/ is still"
          echo "::error::not serving this build's <head>. The upload succeeded, so this is the"
          echo "::error::edge serving something else — check the Worker's route, and that the"
          echo "::error::printbed-optimiser AAAA 100:: record still exists and is proxied."
          exit 1
